<!DOCTYPE html>
<html lang="en">
<head>
    <title>Study Guide</title>

    <style>
        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        body.dark-mode a {
            color: #90caf9;
        }

        #studyDashboard {
            background-color: #e0f2fe;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            margin-bottom: 20px;
            max-width: 500px;

            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }
        #studyDashboard h2 {
            grid-column: 1 / -1;

            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        body.dark-mode #studyDashboard {
            background-color: #2d2d2d;
            color: white;
        }

        #studyDashboard p {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);

            margin: 0;

            
        }

        #studyDashboard p:hover {
            transform:  translateY(-3px);
            box-shadow: 0px 5px 12px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode #studyDashboard p {
            background-color: #3a3a3a;
            color: white;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            #studyDashboard {
                grid-template-columns: 1fr;
            }
        }

        #resetDashboardButton {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            grid-column: 1 / -1;
        }

    </style>
</head>
<body>
    <h1>
        Study Guide Hub
    </h1>

    <p>
        Version 1.9.0
    </p>

    <h2>By Anthony Bennese</h2>

    <button id="darkModeButton">
        🌙 Dark Mode
    </button>

    <div id="studyDashboard">
        <h2>📊 Study Dashboard</h2>

        <p id="totalFlashcards">Total Flashcards: 0</p>

        <p id="totalQuestionsSeen">Questions Studied: 0</p>

        <p id="overallAccuracy">Overall Accuracy: 0%</p>

        <p id="totalSubjects">Total Subjects: 4</p>

        <button id="resetDashboardButton">
            🔄 Reset Statistics
        </button>
    </div>

    <h2>
        My Study Guides
    </h2>

    <ul>
        <li>
            <a href="biology.html">🧬 Biology</a>
           
        </li>

        <li>
            <a href="math.html">🧮 Math </a>
        </li>

         <li>
            <a href="history.html">📖 History </a>
        </li>

         <li>
            <a href="ELA.html">📚 ELA </a>
        </li>
         
    </ul>
    
    <script>

        let biologyFlashcards = JSON.parse(localStorage.getItem("biologyFlashcards")) || [];

        let mathFlashcards = JSON.parse(localStorage.getItem("mathFlashcards")) || [];

        let historyFlashcards = JSON.parse(localStorage.getItem("historyFlashcards")) || [];

        let elaFlashcards = JSON.parse(localStorage.getItem("elaFlashcards")) || [];

        let darkModeButton = document.getElementById("darkModeButton");

        let totalFlashcards =
            biologyFlashcards.length +
            mathFlashcards.length +
            historyFlashcards.length +
            elaFlashcards.length;

        document.getElementById("totalFlashcards").textContent =
            "Total Flashcards: " + totalFlashcards;

        let biologyQuestionsSeen = Number(localStorage.getItem("biologyQuestionsSeen")) || 0;

        let mathQuestionsSeen = Number(localStorage.getItem("mathQuestionsSeen")) || 0;

        let historyQuestionsSeen = Number(localStorage.getItem("historyQuestionsSeen")) || 0;

        let elaQuestionsSeen = Number(localStorage.getItem("elaQuestionsSeen")) || 0;

        let totalQuestionsSeen =
            biologyQuestionsSeen +
            mathQuestionsSeen +
            historyQuestionsSeen +
            elaQuestionsSeen;

        document.getElementById("totalQuestionsSeen").textContent =
            "Questions Studied: " + totalQuestionsSeen;

        let biologyCorrectAnswers =
            Number(localStorage.getItem("biologyCorrectAnswers")) || 0;

        let mathCorrectAnswers =
            Number(localStorage.getItem("mathCorrectAnswers")) || 0;

        let historyCorrectAnswers =
            Number(localStorage.getItem("historyCorrectAnswers")) || 0;

        let elaCorrectAnswers =
            Number(localStorage.getItem("elaCorrectAnswers")) || 0;

        let totalCorrectAnswers =
            biologyCorrectAnswers +
            mathCorrectAnswers +
            historyCorrectAnswers +
            elaCorrectAnswers;

        let biologyIncorrectAnswers =
            Number(localStorage.getItem("biologyIncorrectAnswers")) || 0;

        let mathIncorrectAnswers =
            Number(localStorage.getItem("mathIncorrectAnswers")) || 0;

        let historyIncorrectAnswers =
            Number(localStorage.getItem("historyIncorrectAnswers")) || 0;

        let elaIncorrectAnswers =
            Number(localStorage.getItem("elaIncorrectAnswers")) || 0;

        let totalIncorrectAnswers = 
            biologyIncorrectAnswers +
            mathIncorrectAnswers +
            historyIncorrectAnswers +
            elaIncorrectAnswers;

        let totalAnswers = totalCorrectAnswers + totalIncorrectAnswers;

        let overallAccuracy = 0;

        if (totalAnswers > 0) {
            overallAccuracy = Math.round((totalCorrectAnswers / totalAnswers) * 100)
        }

        document.getElementById("overallAccuracy").textContent =
            "Overall Accuracy: " + overallAccuracy + "%"

        let theme = localStorage.getItem("theme");

        if (theme === "dark") {
            document.body.classList.add("dark-mode");
            darkModeButton.textContent = "☀️ Light Mode";
        }

        darkModeButton.addEventListener("click", function() {
            document.body.classList.toggle("dark-mode");

            let isDark = document.body.classList.contains("dark-mode");

            localStorage.setItem("theme", isDark ? "dark" : "light");

            darkModeButton.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode"
        })

        let resetDashboardButton = document.getElementById("resetDashboardButton");

        resetDashboardButton.addEventListener("click", function(){
            let confirmReset = confirm("Are you sure you want to reset all your study statistics?")
        
            if (confirmReset === false) {
                return;
            }

            let subjects = ["biology", "math", "history", "ela"];

            subjects.forEach(function(subject) {
                localStorage.setItem(subject + "QuestionsSeen", 0);
                localStorage.setItem(subject + "CorrectAnswers", 0);
                localStorage.setItem(subject + "IncorrectAnswers", 0);
            })

            document.getElementById("totalQuestionsSeen").textContent =
                "Questions Studied: 0";

            document.getElementById("overallAccuracy").textContent =
                "Overall Accuracy: 0%"

            alert("Your study statistics have been reset successfully!")

        });

        

    </script>
</body>
</html>
